<html lang="en">
<head>

<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{color-scheme:light;--bg:#f7f7f7;--card:#fff;--ink:#2b2b2b;--mut:#6f6f6f;--g:#2b2b2b;--onG:#2b2b2b;--soft:#f7f7f7;--line:#e6e6e6;--red:#4a4a4a}
*{box-sizing:border-box;margin:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:60px;-webkit-font-smoothing:antialiased}
.in{max-width:960px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:0;z-index:8;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{display:flex;justify-content:space-between;align-items:center;height:64px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand img{height:42px;width:auto;flex:none}
.brand b{font-family:'Fraunces',Georgia,serif;font-size:1.45rem;font-weight:700;letter-spacing:-.3px}
.nav{display:flex;gap:8px}
button{font:inherit;font-size:.95rem;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 14px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
button:hover{border-color:var(--g)}
button.p{background:var(--soft);color:var(--ink);border-color:var(--line)}
button.p:hover{border-color:var(--mut)}
button.d{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.stats div{padding:16px 20px}
.stats div+div{border-left:1px solid var(--line)}
.stats small{color:var(--mut);font-size:.9rem;display:block}
.stats b{font-size:1.9rem;font-weight:600;line-height:1.2;color:var(--g)}
.chips{display:flex;gap:2px;background:var(--soft);border-radius:12px;padding:4px;margin-top:22px;width:100%;overflow:hidden}
.chip{border:none;background:none;border-radius:9px;white-space:nowrap;color:var(--mut);flex:1;justify-content:center;padding:6px 4px;font-size:.86rem}
.chip.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.row .chip{border:1px solid var(--line);flex:none;padding:6px 14px;font-size:.95rem}
.sh{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}
.sh h2{font-size:1.15rem;font-weight:700}
.grid+.sh{border-top:1px solid var(--line);margin-top:30px;padding-top:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;transition:.15s}
.card:hover{border-color:var(--mut)}
.im{aspect-ratio:16/9;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.im img{width:100%;height:100%;object-fit:cover}
.tx{padding:14px 16px 16px}
.nm{font-weight:600;font-size:.95rem;line-height:1.35}
.tt{font-size:.9rem;color:var(--mut);min-height:1.4em}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.85rem;color:var(--mut)}
.bd{background:var(--soft);color:var(--mut);border-radius:8px;padding:1px 10px;font-weight:500;font-size:.82rem}
.x{position:absolute;top:6px;right:6px;padding:4px;border:none;background:none;border-radius:6px;color:var(--mut);opacity:.75;filter:drop-shadow(0 0 2px #fff)}
.x:hover{opacity:1;color:var(--ink)}
.plus{padding:6px 9px}
.card.empty{border:1.5px dashed var(--line);background:transparent}
.card.empty:hover{box-shadow:none}
.card.empty .im{background:transparent;color:var(--mut);aspect-ratio:16/7}
.card.empty .nm{color:var(--mut);font-weight:400;font-size:.95rem}
#back,#dback,#lback{background:none;border:none;box-shadow:none;padding:6px 10px 6px 0;min-height:0;color:var(--mut);display:inline-flex;align-items:center}
#back:hover,#dback:hover,#lback:hover,#back:active,#dback:active,#lback:active{background:none;box-shadow:none;color:var(--ink)}
.dmw{position:relative}
.dtl{flex:1;min-width:0;text-align:center;font-weight:700;font-size:1.05rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.dd.dm{left:auto;right:0;min-width:0;width:max-content;top:calc(100% + 2px);padding:3px;border-radius:10px}
.dd.dm button{padding:6px 10px;gap:6px;font-size:.85rem;border-radius:7px;white-space:nowrap}
#dots{background:none;border:none;box-shadow:none;padding:6px 2px 6px 10px;min-height:0;color:var(--mut);display:inline-flex;align-items:center}
#dots:hover,#dots:active{background:none;box-shadow:none;color:var(--ink)}
.card.empty .im svg{opacity:.28;transition:opacity .15s}
.card.empty:hover .im svg{opacity:.5}
input,textarea{font:inherit;width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus,textarea:focus{outline:1px solid var(--mut);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:130px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.box{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:420px;display:grid;gap:12px}
.pv{width:100%;aspect-ratio:16/9;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mut)}
.pv img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:8px;align-items:center}
.dh{display:flex;gap:18px;align-items:center;margin-top:16px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.lg{width:76px;height:76px;border-radius:14px;background:var(--soft);color:var(--g);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.lg img{width:100%;height:100%;object-fit:cover}
.dh h2{font-size:1.4rem;line-height:1.3;font-weight:700}
.dh .st{color:var(--mut);font-size:.95rem}
.dh .meta{justify-content:flex-start;gap:10px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:18px;border-bottom:1px solid var(--line)}
.tab{border:none;background:none;border-radius:0;flex:1 0 auto;justify-content:center;padding:10px 8px;font-size:.88rem;color:var(--mut);white-space:nowrap;margin-bottom:-1px;border-bottom:2px solid transparent}
.tab.on{color:var(--g);border-bottom-color:var(--g);font-weight:600}
.ngrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media(min-width:640px){.ngrid{grid-template-columns:repeat(3,1fr)}}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:112px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.ncard:hover{border-color:var(--mut)}
.nct{font-weight:700;font-size:.95rem;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncp{color:var(--mut);font-size:.85rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;flex:1}
.ncd{font-size:.75rem;color:var(--mut);margin-top:auto;padding-top:4px}
.ne{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px 20px;margin-top:16px}
.nbar{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.8rem}
.nbar button{border:none;background:none;padding:6px;color:var(--mut)}
.ne input{border:none;background:none;padding:10px 0 6px;font-size:1.35rem;font-weight:700;border-radius:0}
.ne textarea{border:none;background:none;padding:6px 0;font-size:1rem;line-height:1.75;min-height:50vh;resize:none;border-radius:0;overflow:hidden}
.ne input:focus,.ne textarea:focus{outline:none}
.fab{position:fixed;right:max(18px,calc(50vw - 462px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:14;width:54px;height:54px;padding:0;justify-content:center;border-radius:18px;border:none;background:#fff;color:var(--ink);box-shadow:var(--raise)}
.fab:hover{border:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.panel h3{font-size:1.05rem;margin-bottom:10px}
.ck{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ck input[type=checkbox]{width:20px;height:20px;accent-color:var(--g);flex:none}
.ck span{flex:1}
.ck.done span{text-decoration:line-through;color:var(--mut)}
.ck button{padding:4px;border:none;background:none}
.note{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.note small{color:var(--mut);display:flex;justify-content:space-between;margin-bottom:4px}
.note textarea{min-height:80px}
iframe{width:100%;height:420px;border:1px solid var(--line);border-radius:12px;margin-top:12px;background:var(--card)}
.mut{color:var(--mut);font-size:.9rem}
.gate{text-align:center;padding:70px 16px;color:var(--mut)}
.gate svg{color:var(--g)}
.hide{display:none!important}
@media(max-width:560px){.in{padding:0 14px}.brand b{font-size:1.1rem}.nav button span{display:none}.nav button{padding:8px 10px}.stats b{font-size:1.5rem}.stats div{padding:12px 14px}.grid{grid-template-columns:1fr 1fr;gap:12px}.tx{padding:10px 12px 12px}.nm{font-size:.88rem}.dh{gap:12px;padding:14px}.lg{width:60px;height:60px}}
.top .in{justify-content:center;height:56px}
.brand b{font-size:1.3rem}
.hl{position:absolute;left:14px;top:50%;transform:translateY(-50%);height:auto;width:auto;cursor:pointer;padding:6px;border:none;background:none;color:var(--ink)}
body{padding-bottom:90px}
.modal{z-index:40}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;background:var(--bg)}
.bar{padding:0 0 env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line)}
.bar .chips{margin:0;width:100%;max-width:none;border-radius:0;background:none;padding:6px 8px;gap:4px}
.bar .chip{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 4px;border:1px solid transparent}
.ico{position:relative;display:inline-flex}
.ico i{position:absolute;bottom:80%;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:0;animation:rise 2.6s ease-out infinite}
.ico i:nth-of-type(1){left:6px}.ico i:nth-of-type(2){left:10px;animation-delay:.87s}.ico i:nth-of-type(3){left:14px;animation-delay:1.73s}
@keyframes rise{0%{transform:translateY(4px);opacity:0}25%{opacity:.9}100%{transform:translateY(-8px);opacity:0}}
@media(prefers-reduced-motion:reduce){.ico i{animation:none;opacity:.6;transform:translateY(-4px)}}
.ico .ar{position:absolute;left:0;top:0;width:20px;height:20px;animation:shoot 2.6s ease-out infinite}
@keyframes shoot{0%{transform:translate(8px,-8px);opacity:0}18%{transform:translate(0,0);opacity:1}78%{transform:translate(0,0);opacity:1}100%{transform:translate(0,0);opacity:0}}
@media(prefers-reduced-motion:reduce){.ico .ar{animation:none}}
.bk{transform-box:fill-box;animation:drop 2.6s ease-out infinite}
@keyframes drop{0%{transform:translateY(-9px);opacity:0}18%{transform:translateY(0);opacity:1}25%{transform:translateY(-2px)}32%{transform:translateY(0)}78%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
@media(prefers-reduced-motion:reduce){.bk{animation:none}}
.dd{position:absolute;left:14px;top:calc(100% + 6px);z-index:20;min-width:230px;display:none;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 24px #0002}
.dd.on{display:flex}
.lpg{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lpg.on{display:block}
.lbox{max-width:400px;margin:0 auto;padding:16px 20px 40px;display:grid;gap:14px}
.lbox .panel{display:grid;gap:12px;margin-top:0;box-shadow:var(--raise)}
.lbox .tabs{margin-top:4px}
.lt{font-family:'Fraunces',Georgia,serif;font-size:1.9rem;font-weight:700;text-align:center;margin-top:10px}
.ls{text-align:center;color:var(--mut);font-size:.92rem;margin-top:-8px}
.lerr{min-height:1.2em;font-size:.88rem;color:var(--red)}
.lerr.ok{color:var(--mut)}
.lk{font-size:.86rem;color:var(--mut);background:none;border:none;padding:0;justify-self:end;text-decoration:underline}
.lbtn{justify-content:center;width:100%}
#lgo{background:#fff;color:var(--ink);border-color:transparent;font-weight:600;box-shadow:var(--raise)}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:.85rem}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.dprof{display:flex;gap:14px;align-items:center;padding:6px 2px}
.dprof .lg{width:64px;height:64px;border-radius:50%}
.dprof b{display:block;font-size:1.15rem;line-height:1.3}
.dprof small{color:var(--mut);font-size:.9rem;word-break:break-all}
#dp .stats{margin-top:0}
.drow{width:100%;justify-content:flex-start;text-align:left;padding:12px 14px;gap:12px;align-items:center}
.drow span{display:flex;flex-direction:column;line-height:1.35}
.drow small{color:var(--mut);font-size:.82rem}
.card.sk{pointer-events:none;cursor:default}
.sk .im,.sk .nm{background:linear-gradient(90deg,var(--soft) 25%,#fff 50%,var(--soft) 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}
.sk .nm{height:14px;width:60%;border-radius:6px;margin:4px 0}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk .im,.sk .nm{animation:none}}
#rm{z-index:48}
#rl{display:grid;gap:8px;max-height:55vh;overflow:auto}
.sep{height:1px;background:var(--line);margin:4px 6px}
.am p{white-space:pre-line;color:var(--mut);font-size:.95rem}
.dd button{border:none;background:none;width:100%;justify-content:flex-start;padding:10px 12px;border-radius:8px;font-size:.92rem}
.dd button:hover{background:var(--soft)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:10px;font-size:.9rem;z-index:50;max-width:90%;text-align:center}
.dd button.busy{opacity:.4;pointer-events:none}
.bar .chip.on{border-color:var(--line);background:var(--soft);box-shadow:none}
.tb{position:absolute;right:14px;top:50%;transform:translateY(-50%);flex-direction:row;gap:6px;padding:4px;border:none;background:none;font-size:.85rem;color:var(--ink)}
.lw{position:relative;width:50px;height:54px}
#dim{position:fixed;inset:0;z-index:12;display:none}
.fo #dim{display:block}
.mn{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,6px);display:flex;gap:6px;opacity:0;pointer-events:none;transition:.18s}
.fo .mn{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pl{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.88rem;font-weight:500;white-space:nowrap}
.pl:hover{border-color:var(--mut)}

.chips,.tabs{scrollbar-width:none}.chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.ph{background:var(--soft);color:#d3ccbe}
.blur{width:100%;height:100%;padding:12px 14px;overflow:hidden;font-size:.78rem;line-height:1.45;color:var(--ink);opacity:.6;text-align:left;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.blur.empty{display:flex;align-items:center;justify-content:center;text-align:center;opacity:.35;font-style:italic}

/* ====== all white, no black fills: three white "materials" ====== */
:root{
  --hi:#fff;--lo:#d9d9d9;--ring:#2b2b2b1f;
  --fx-top:0 4px 18px -8px #0000002e;
  --fx-bar:0 -6px 20px -10px #0000002e;
  --press:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);
  --raise:0 6px 14px -6px #00000059,0 0 0 1px var(--line);
  --fx-project:0 6px 14px -8px #00000059;
  --fx-idea:0 14px 40px -10px #00000033,0 0 26px #fff;
  --fx-dream:8px 8px 18px var(--lo),-8px -8px 18px var(--hi);
}
.ph{color:var(--line)}
.top{box-shadow:var(--fx-top)}
.bar{box-shadow:var(--fx-bar)}
.dd{box-shadow:var(--fx-idea)}
.modal{background:#ffffffc7;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.box{box-shadow:var(--raise)}
.toast{background:#fff;color:var(--ink);box-shadow:var(--raise)}
[data-t=project]{--fx:var(--fx-project)}
[data-t=idea]{--fx:var(--fx-project)}
[data-t=dream]{--fx:var(--fx-project)}
.card[data-t],.card[data-t]:hover{box-shadow:var(--fx)}
.card[data-t] .ph{background:transparent}
.card[data-t] .blur{color:var(--ink);opacity:.72}
/* all categories: solid white, hairline, tight shadow */
.card[data-t] .im{border-bottom:1px solid var(--line)}
.card.empty[data-t],.card.empty[data-t]:hover{box-shadow:none;background:transparent}
#detail .dh{box-shadow:var(--fx)}
#detail .lg{background:var(--bg);border:none;box-shadow:var(--press);color:var(--ink)}
input:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px var(--ring);border-color:var(--mut)}
.bar .chip.on,.row .chip.on{background:var(--bg);color:var(--ink);border-color:transparent;box-shadow:var(--press)}
.bd[data-s]{font-weight:600}
.bd[data-s="In progress"]{background:var(--bg);color:var(--ink);box-shadow:var(--press)}
.bd[data-s="On hold"]{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--mut)}
.bd[data-s="Done"]{background:#fff;color:var(--ink);box-shadow:0 1px 5px #0000003d}
#msave{background:#fff;color:var(--ink);border-color:transparent;font-weight:600;box-shadow:var(--raise)}
.dd button:hover{background:var(--bg);box-shadow:var(--press)}
button.d:hover{box-shadow:var(--press)}
/* ====== Samsung-style full-page note editor ====== */
.npg{position:fixed;inset:0;z-index:30;background:var(--card);display:none;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
.npg.on{display:flex}
.nt{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--line);flex:none}
.nt button{border:none;background:none;padding:10px;color:var(--ink);box-shadow:none}
.nt button:hover{border:none;color:var(--mut)}
.nb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;max-width:760px;margin:0 auto;padding:14px 20px calc(28px + env(safe-area-inset-bottom,0px))}
.nb input{border:none;background:none;padding:6px 0;font-size:1.5rem;font-weight:700;border-radius:0}
.nb textarea{border:none;background:none;padding:6px 0;font-size:1.05rem;line-height:1.8;min-height:60vh;resize:none;overflow:hidden;border-radius:0}
.nb input:focus,.nb textarea:focus{outline:none;box-shadow:none}
.nmeta{color:var(--mut);font-size:.8rem;padding:2px 0 10px}
/* ====== Samsung-style clean note editor: sticky toolbar ====== */
.nt{position:relative}
.nttl{flex:1;min-width:0;text-align:center;font-weight:700;font-size:1.05rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.tbr{display:flex;align-items:center;gap:2px;padding:2px 8px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.tbr::-webkit-scrollbar{display:none}

};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const DF=()=>({checklist:[],features:[],notes:[],desc:'',rough:'',roughNotes:[],fullNotes:[],driveId:'',status:'In progress'});
const D={};let loading=false,authWait=false,guestLoaded=false,cacheUid=null,pre='guest',lt=null;let cur=null,tab='rough',filter='all',mode=null,user=null,unsub=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deb=(f,ms=600)=>{let t=null,a=[];const g=(...x)=>{a=x;clearTimeout(t);t=setTimeout(()=>{t=null;f(...a)},ms)};g.flush=()=>{if(t){clearTimeout(t);t=null;f(...a)}};return g};
const OLD_DEMO={'Personal Website':'A website to showcase my work and writing in one place.','Write a Book':'Plan to write a little every day.','Fitness Routine':'Exercise at least 4 days a week.','Online Course':'A course to build skills from home.','Own Home':'A home of our own for the family.','World Travel':'Visit at least 10 countries in life.','Own Company':'Build a company of my own.','Start a Library':'A small library open to everyone.','Mobile App Idea':'An app with simple solutions to everyday problems.','YouTube Channel':'Explain what I know in simple language.','Community Library':'Sharing books among neighbors.','Kids Learning Game':'A game to learn math and language through play.'};
const isDemo=v=>!!v&&((/^Demo [1-4]$/.test(v.name||'')&&(v.desc||'').startsWith("It's a demo."))||OLD_DEMO[v.name]===v.desc);
const cacheSave=deb(()=>{if(!cloud())return;try{localStorage.setItem('bm_cache_v1',JSON.stringify({uid:user.uid,items:D}))}catch(e){}},1500);
const col=()=>F.collection(db,'users',user.uid,'items'),dref=id=>F.doc(db,'users',user.uid,'items',id);
const fail=(m,e)=>{console.warn(e);toast(m+(e&&(e.code||e.message)?': '+(e.code||e.message):''))};
/* ====== Auto backup (Firebase) ====== */
let bkT=null,bkBusy=false,bkDirty=false,bkDay=0,bkErr=false;
const bkOn=()=>{try{return !localStorage.getItem('bm_autobk_off')}catch(e){return true}};
const bkCol=()=>F.collection(db,'users',user.uid,'backups');
const bkRef=id=>F.doc(db,'users',user.uid,'backups',id);
const bkParts=id=>F.collection(db,'users',user.uid,'backups',id,'parts');
const dayId=()=>{const d=new Date();return 'day-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ago=ms=>{const s=Math.round((Date.now()-ms)/1000);return s<60?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' hr ago':Math.round(s/86400)+' days ago'};
function bkSoon(){cacheSave();if(!cloud()||!bkOn())return;bkDirty=true;clearTimeout(bkT);bkT=setTimeout(bkRun,5000)}
async function bkWrite(id,items){
  const json=JSON.stringify({app:'Brainmate',savedAt:new Date().toISOString(),items});
  const parts=[];for(let i=0;i<json.length;i+=250000)parts.push(json.slice(i,i+250000));
  let old=0;try{const sn=await F.getDoc(bkRef(id));if(sn.exists())old=sn.data().parts||0}catch(e){}
  for(let i=0;i<parts.length;i++)await F.setDoc(F.doc(bkParts(id),String(i)),{i,d:parts[i]});
  for(let i=parts.length;i<old;i++)await F.deleteDoc(F.doc(bkParts(id),String(i)));
  await F.setDoc(bkRef(id),{at:Date.now(),count:Object.keys(items).length,parts:parts.length});
}
async function bkDel(id){
  const sn=await F.getDocs(bkParts(id));
  for(const d of sn.docs)await F.deleteDoc(d.ref);
  await F.deleteDoc(bkRef(id));
}
async function bkPrune(){
  try{
    const sn=await F.getDocs(bkCol());
    const days=sn.docs.map(d=>d.id).filter(i=>i.startsWith('day-')).sort().reverse().slice(7);
    for(const id of days)await bkDel(id);
  }catch(e){console.warn(e)}
}
async function bkRun(){
  if(!cloud()||!bkOn()||!Object.keys(D).length)return;
  if(bkBusy)return;
  bkBusy=true;bkDirty=false;
  try{
    const snap=JSON.parse(JSON.stringify(D));
    await bkWrite('latest',snap);
    if(Date.now()-bkDay>30*60*1000){const first=!bkDay;await bkWrite(dayId(),snap);bkDay=Date.now();if(first)bkPrune()}
    bkErr=false;
    if($('#dp').classList.contains('on'))bkStatus();
  }catch(e){if(!bkErr){bkErr=true;fail('Auto backup failed',e)}}
  bkBusy=false;
  if(bkDirty)bkSoon();
}
async function bkStatus(){
  const el=$('#bkst');if(!el||!cloud())return;
  const on=bkOn();
  el.textContent=on?'Auto backup is on':'Auto backup is off';
  document.querySelector('[data-bk=toggle]').innerHTML=ic('cloud',18)+'<span><b>'+(on?'Turn off auto backup':'Turn on auto backup')+'</b><small>'+(on?'Stop saving backups automatically':'Save a backup after every change')+'</small></span>';
  try{
    const sn=await F.getDoc(bkRef('latest'));
    el.textContent+=sn.exists()?' · Last backup: '+ago(sn.data().at):' · No backup yet';
  }catch(e){}
}
async function bkRead(id){
  const sn=await F.getDocs(bkParts(id));
  const txt=sn.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i).map(x=>x.d).join('');
  return JSON.parse(txt);
}
const closeRm=()=>$('#rm').classList.remove('on');
const bkName=id=>id==='latest'?'Latest backup':id==='before-restore'?'Before last restore':id.startsWith('day-')?'Daily — '+id.slice(4):id;
async function openRm(){
  if(!cloud())return;
  $('#rm').classList.add('on');$('#rl').innerHTML='<div class="mut">Loading…</div>';
  try{
    const sn=await F.getDocs(bkCol());
    const L=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));
    $('#rl').innerHTML=L.length?L.map(b=>`<button class="drow" data-r="${esc(b.id)}"><span><b>${esc(bkName(b.id))}</b><small>${new Date(b.at).toLocaleString('en-US')} · ${b.count||0} items</small></span></button>`).join(''):'<div class="mut">No backups yet. They are created automatically after your changes.</div>';
  }catch(e){closeRm();fail('Could not load backups',e)}
}
async function bkRestore(id){
  try{
    const o=await bkRead(id);
    const list=Object.values((o&&o.items)||{}).filter(v=>v&&TYPES[v.type]&&v.name!==undefined);
    if(!list.length)return toast('This backup is empty');
    if(!confirm('Restore '+list.length+' items? Your current items will be replaced. A safety copy of your current data is saved first.'))return;
    $('#rl').innerHTML='<div class="mut">Restoring…</div>';
    if(Object.keys(D).length)await bkWrite('before-restore',JSON.parse(JSON.stringify(D)));
    const ops=[];
    Object.keys(D).forEach(k=>ops.push(b=>b.delete(dref(k))));
    list.forEach(v=>{const {created,...r}=v;ops.push(b=>b.set(F.doc(col()),{...DF(),...r,created:F.serverTimestamp()}))});
    for(let i=0;i<ops.length;i+=400){const b=F.writeBatch(db);ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}
    closeRm();goHome();toast('Backup restored');bkSoon();
  }catch(e){closeRm();fail('Restore failed',e)}
}

  if(tab==='check')h=`<div class="panel"><h3>Checklist</h3>${v.checklist.map((x,i)=>`<div class="ck ${x.d?'done':''}"><input type="checkbox" data-a="ctog" data-i="${i}" ${x.d?'checked':''}><span>${esc(x.t)}</span><button class="d" data-a="cdel" data-i="${i}">${ic('x',16)}</button></div>`).join('')||'<div class="mut">No tasks yet</div>'}<div class="row" style="margin-top:10px"><input id="cin" data-enter="cadd" placeholder="New task…"><button class="p" data-a="cadd">Add</button></div></div>`;
  if(tab==='drive')h=`<div class="panel"><h3>Drive preview</h3><div class="row"><input id="din" data-enter="dset" placeholder="Google Drive folder link or ID" value="${esc(v.driveId?'https://drive.google.com/drive/folders/'+v.driveId:'')}"><button class="p" data-a="dset">Show</button></div><div class="mut" style="margin-top:6px">The folder must be shared as “Anyone with the link — Viewer”.</div>${v.driveId?`<iframe src="https://drive.google.com/embeddedfolderview?id=${v.driveId}#grid" loading="lazy"></iframe>`:''}</div>`;
  tc.innerHTML=h;noteEd();
}
const sd1=deb((id,p)=>save(id,p)),sd2=deb((id,p)=>save(id,p));
$('#npg').onclick=e=>{

$('#npg').oninput=e=>{
  const t=e.target;if(t.id!=='ntt'&&t.id!=='ntx')return;
  const f=NK[tab],n=D[cur][f].find(x=>x.id===nid);if(!n)return;
  if(t.id==='ntt'){n.t=t.value;const tt=$('#nttl');if(tt)tt.textContent=n.t||'Note'}else{n.x=t.value;grow(t);refitCv()}
  n.up=Date.now();$('#nmeta').textContent=nInfo(n);sd2(cur,{[f]:D[cur][f]});
};
function bindTc(){
  const tc=$('#tc');
  tc.onclick=e=>{
    const b=e.target.closest('[data-a]');if(!b)return;
    const v=D[cur],a=b.dataset.a,i=+b.dataset.i,inp=id=>$(id).value.trim();
    if(a==='nnew'){const f=NK[tab],t=Date.now(),n={id:nUid(),t:'',x:'',at:t,up:t};save(cur,{[f]:[...v[f],n]});nid=n.id;renderTab();$('#ntt')?.focus()}
    else if(a==='nopen'){nid=b.dataset.id;renderTab();window.scrollTo(0,0)}
    else if(a==='ndel'){if(!confirm('Delete this note?'))return;sd2.flush();const f=NK[tab];save(cur,{[f]:v[f].filter(x=>x.id!==nid)});nid=null;renderTab()}
    else if(a==='fadd'){const t=inp('#fin');if(!t)return;save(cur,{features:[...v.features,t]});renderTab()}
    else if(a==='fdel'){const f=[...v.features];f.splice(i,1);save(cur,{features:f});renderTab()}
    else if(a==='cadd'){const t=inp('#cin');if(!t)return;save(cur,{checklist:[...v.checklist,{t,d:false}]});renderTab()}
    else if(a==='ctog'){const L=v.checklist.map(x=>({...x}));L[i].d=b.checked;save(cur,{checklist:L});renderTab()}
    else if(a==='cdel'){const L=[...v.checklist];L.splice(i,1);save(cur,{checklist:L});renderTab()}
    else if(a==='dset'){const s=inp('#din'),m=s.match(/folders\/([\w-]+)/)||s.match(/[?&]id=([\w-]+)/)||s.match(/^([\w-]{15,})$/);save(cur,{driveId:m?m[1]:''});renderTab()}
  };
  tc.onkeydown=e=>{const k=e.target.dataset.enter;if(e.key==='Enter'&&k)tc.querySelector(`[data-a="${k}"]`).click()};
  tc.oninput=e=>{
    const t=e.target;
    if(t.id==='ntt'||t.id==='ntx'){
      const f=NK[tab],n=D[cur][f].find(x=>x.id===nid);if(!n)return;
      if(t.id==='ntt')n.t=t.value;else{n.x=t.value;grow(t)}
      n.up=Date.now();sd2(cur,{[f]:D[cur][f]});
    }
  };
}

function loadGuest(){
  let o=null;try{o=JSON.parse(localStorage.getItem(LK)||'null')}catch(e){}
  if(o&&Object.keys(o).length)Object.entries(o).forEach(([k,v])=>D[k]={...DF(),...v});
  let rm=0;Object.keys(D).forEach(k=>{if(isDemo(D[k])){delete D[k];rm++}});if(rm)saveLocal();
}
function listen(){
  let first=true;
  unsub=F.onSnapshot(col(),s=>{
    const real=!s.metadata.fromCache||!s.empty;
    if(first&&real){first=false;const ids=new Set(s.docs.map(d=>d.id));Object.keys(D).forEach(k=>{if(!ids.has(k))delete D[k]})}
    if(loading&&real){loading=false;clearTimeout(lt)}
    s.docChanges().forEach(c=>{
      if(c.type==='removed')delete D[c.doc.id];
      else if(c.doc.id!==cur)D[c.doc.id]={...DF(),...c.doc.data()};
    });
    if(!s.metadata.fromCache)Object.keys(D).forEach(id=>{if(isDemo(D[id])&&id!==cur){delete D[id];F.deleteDoc(dref(id)).catch(()=>{})}});
    cacheSave();
    if(!cur)home();
  },e=>{loading=false;fail('Could not load your data',e);home()});
}
{const I={all:'home',project:'blocks',idea:'brain',dream:'target'};document.querySelectorAll('.bar .chip').forEach(c=>c.insertAdjacentHTML('afterbegin',c.dataset.k==='idea'?'<span class="ico">'+ic(I.idea,20)+'<i></i><i></i><i></i></span>':c.dataset.k==='dream'?'<span class="ico">'+ic(I.dream,20)+'<svg class="ar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L12 12M12 12h5M12 12V7"/></svg></span>':c.dataset.k==='project'?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"/><rect class="bk" width="7" height="7" x="14" y="3" rx="1"/></svg>':ic(I[c.dataset.k],20)))}
document.querySelectorAll('.bar .chip').forEach(c=>c.onclick=()=>{filter=c.dataset.k;goHome()});
/* ====== Mobile back button: close the top layer first; at home press back twice to exit ====== */
(()=>{
  try{history.replaceState({bm:'root'},'');history.pushState({bm:'home'},'')}catch(e){return}
  const isOn=id=>$(id).classList.contains('on');
  const L=[
    {el:'#dd',open:()=>isOn('#dd'),close:()=>$('#dd').classList.remove('on')},
    {el:'#rm',open:()=>isOn('#rm'),close:closeRm},
    {el:'#am',open:()=>isOn('#am'),close:()=>$('#am').classList.remove('on')},
    {el:'#modal',open:()=>isOn('#modal'),close:closeModal},
    {el:'#lp',open:()=>isOn('#lp'),close:closeLogin},
    {el:'#dp',open:()=>isOn('#dp'),close:closeDash},
    {el:'#npg',open:()=>isOn('#npg'),close:closeNote},
    {el:'#detail',open:()=>!$('#detail').classList.contains('hide'),close:goHome}
  ];
  let depth=0,ignore=0,seq=0,armed=false,at=null;
  const sync=()=>{
    let n=0;
    L.forEach(l=>{const o=l.open();if(o){n++;if(!l.s)l.s=++seq}else l.s=0});
    while(depth<n){try{history.pushState({bm:'ov'},'')}catch(e){}depth++}
    if(depth>n){const k=depth-n;depth=n;ignore++;history.go(-k)}
  };
  const mo=new MutationObserver(sync);
  L.forEach(l=>mo.observe($(l.el),{attributes:true,attributeFilter:['class']}));
  addEventListener('popstate',e=>{
    if(ignore>0){ignore--;return}
    const st=e.state;
    if(st&&st.bm==='root'){
      if(armed){history.go(-1);return}
      armed=true;toast('Press back again to exit');
      try{history.pushState({bm:'home'},'')}catch(x){}
      clearTimeout(at);at=setTimeout(()=>{armed=false},2000);
      return;
    }
    if(depth>0){
      depth--;
      const top=L.filter(l=>l.open()).sort((a,b)=>b.s-a.s)[0];
      if(top)top.close();
      sync();
    }
  });
})();
addEventListener('pagehide',()=>{sd1.flush();sd2.flush();cacheSave.flush()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){sd1.flush();sd2.flush()}});
nav();
{
  let wasIn=false;try{wasIn=!!localStorage.getItem('bm_wasin')}catch(e){}
  if(wasIn){
    let c=null;try{c=JSON.parse(localStorage.getItem('bm_cache_v1')||'null')}catch(e){}
    if(c&&c.items&&Object.keys(c.items).length){Object.entries(c.items).forEach(([k,v])=>D[k]={...DF(),...v});cacheUid=c.uid;pre='cache'}
    else{pre='skel';loading=true}
    authWait=true;
  }else{loadGuest();guestLoaded=true}
  home();
}
fbReady.then(()=>{
  if(!auth){
    if(pre==='cache'){toast('Offline: showing your last saved data');return}
    authWait=false;loading=false;
    if(!guestLoaded){Object.keys(D).forEach(k=>delete D[k]);loadGuest();guestLoaded=true}
    home();return;
  }
  A.onAuthStateChanged(auth,u=>{
    const was=user,keep=!!u&&pre==='cache'&&cacheUid===u.uid&&!was;
    user=u;authWait=false;
    nav();if(!u)closeDash();clearTimeout(bkT);bkDay=0;bkErr=false;
    if(unsub){unsub();unsub=null}
    if(u){
      try{localStorage.setItem('bm_wasin','1')}catch(e){}
      if(keep)loading=false;
      else{Object.keys(D).forEach(k=>delete D[k]);loading=true}
      guestLoaded=false;pre='';
      clearTimeout(lt);lt=setTimeout(()=>{if(loading){loading=false;home()}},8000);
      listen();
    }else{
      try{localStorage.removeItem('bm_wasin');localStorage.removeItem('bm_cache_v1')}catch(e){}
      loading=false;pre='';
      if(!guestLoaded){Object.keys(D).forEach(k=>delete D[k]);loadGuest();guestLoaded=true}
    }
    if(keep&&cur)home();else goHome();
  });
});
