<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<meta name="description" content="Track your creations, imagination and aspirations in one place.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brainmate">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Brainmate</title>
<link rel="icon" href="icons/icon-192-v2.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f7f7f7;--card:#fff;--ink:#2b2b2b;--mut:#6f6f6f;--g:#2b2b2b;--onG:#2b2b2b;--soft:#f7f7f7;--line:#e6e6e6;--red:#4a4a4a}
*{box-sizing:border-box;margin:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:60px;-webkit-font-smoothing:antialiased}
.in{max-width:960px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:0;z-index:8;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{display:flex;justify-content:space-between;align-items:center;height:64px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand img{height:42px;width:auto;flex:none}
.brand b{font-family:'Fraunces',Georgia,serif;font-size:1.45rem;font-weight:700;letter-spacing:-.3px}
.nav{display:flex;gap:8px}
button{font:inherit;font-size:.95rem;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 14px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
button:hover{border-color:var(--g)}
button.p{background:var(--soft);color:var(--ink);border-color:var(--line)}
button.p:hover{border-color:var(--mut)}
button.d{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.stats div{padding:16px 20px}
.stats div+div{border-left:1px solid var(--line)}
.stats small{color:var(--mut);font-size:.9rem;display:block}
.stats b{font-size:1.9rem;font-weight:600;line-height:1.2;color:var(--g)}
.chips{display:flex;gap:2px;background:var(--soft);border-radius:12px;padding:4px;margin-top:22px;width:100%;overflow:hidden}
.chip{border:none;background:none;border-radius:9px;white-space:nowrap;color:var(--mut);flex:1;justify-content:center;padding:6px 4px;font-size:.86rem}
.chip.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.row .chip{border:1px solid var(--line);flex:none;padding:6px 14px;font-size:.95rem}
.sh{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}
.sh h2{font-size:1.15rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;transition:.15s}
.card:hover{border-color:var(--mut)}
.im{aspect-ratio:16/9;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.im img{width:100%;height:100%;object-fit:cover}
.tx{padding:14px 16px 16px}
.nm{font-weight:600;font-size:.95rem;line-height:1.35}
.tt{font-size:.9rem;color:var(--mut);min-height:1.4em}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.85rem;color:var(--mut)}
.bd{background:var(--soft);color:var(--mut);border-radius:8px;padding:1px 10px;font-weight:500;font-size:.82rem}
.x{position:absolute;top:6px;right:6px;padding:4px;border:none;background:none;border-radius:6px;color:var(--mut);opacity:.75;filter:drop-shadow(0 0 2px #fff)}
.x:hover{opacity:1;color:var(--ink)}
.plus{padding:6px 9px}
.card.empty{border:1.5px dashed var(--line);background:transparent}
.card.empty:hover{box-shadow:none}
.card.empty .im{background:transparent;color:var(--mut);aspect-ratio:16/7}
.card.empty .nm{color:var(--mut);font-weight:400;font-size:.95rem}
input,textarea{font:inherit;width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus,textarea:focus{outline:1px solid var(--mut);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:130px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.box{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:420px;display:grid;gap:12px}
.pv{width:100%;aspect-ratio:16/9;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mut)}
.pv img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:8px;align-items:center}
.dh{display:flex;gap:18px;align-items:center;margin-top:16px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.lg{width:76px;height:76px;border-radius:14px;background:var(--soft);color:var(--g);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.lg img{width:100%;height:100%;object-fit:cover}
.dh h2{font-size:1.4rem;line-height:1.3;font-weight:700}
.dh .st{color:var(--mut);font-size:.95rem}
.dh .meta{justify-content:flex-start;gap:10px}
.tabs{display:flex;gap:2px;overflow:hidden;margin-top:18px;border-bottom:1px solid var(--line)}
.tab{border:none;background:none;border-radius:0;flex:1;justify-content:center;padding:10px 2px;font-size:.88rem;color:var(--mut);white-space:nowrap;margin-bottom:-1px;border-bottom:2px solid transparent}
.tab.on{color:var(--g);border-bottom-color:var(--g);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.panel h3{font-size:1.05rem;margin-bottom:10px}
.ck{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ck input[type=checkbox]{width:20px;height:20px;accent-color:var(--g);flex:none}
.ck span{flex:1}
.ck.done span{text-decoration:line-through;color:var(--mut)}
.ck button{padding:4px;border:none;background:none}
.note{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.note small{color:var(--mut);display:flex;justify-content:space-between;margin-bottom:4px}
.note textarea{min-height:80px}
iframe{width:100%;height:420px;border:1px solid var(--line);border-radius:12px;margin-top:12px;background:var(--card)}
.mut{color:var(--mut);font-size:.9rem}
.gate{text-align:center;padding:70px 16px;color:var(--mut)}
.gate svg{color:var(--g)}
.hide{display:none!important}
@media(max-width:560px){.in{padding:0 14px}.brand b{font-size:1.1rem}.nav button span{display:none}.nav button{padding:8px 10px}.stats b{font-size:1.5rem}.stats div{padding:12px 14px}.grid{grid-template-columns:1fr 1fr;gap:12px}.tx{padding:10px 12px 12px}.nm{font-size:.88rem}.dh{gap:12px;padding:14px}.lg{width:60px;height:60px}}
.top .in{justify-content:center;height:56px}
.brand b{font-size:1.3rem}
.hl{position:absolute;left:14px;top:50%;transform:translateY(-50%);height:30px;width:auto;cursor:pointer}
body{padding-bottom:90px}
.modal{z-index:40}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;background:var(--bg)}
.bar{padding:0 0 env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line)}
.bar .chips{margin:0;width:100%;max-width:none;border-radius:0;background:none;padding:6px 8px;gap:4px}
.bar .chip{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 4px;border:1px solid transparent}
.ico{position:relative;display:inline-flex}
.ico i{position:absolute;bottom:80%;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:0;animation:rise 2.6s ease-out infinite}
.ico i:nth-of-type(1){left:6px}.ico i:nth-of-type(2){left:10px;animation-delay:.87s}.ico i:nth-of-type(3){left:14px;animation-delay:1.73s}
@keyframes rise{0%{transform:translateY(4px);opacity:0}25%{opacity:.9}100%{transform:translateY(-8px);opacity:0}}
@media(prefers-reduced-motion:reduce){.ico i{animation:none;opacity:.6;transform:translateY(-4px)}}
.ico .ar{position:absolute;left:0;top:0;width:20px;height:20px;animation:shoot 2.6s ease-out infinite}
@keyframes shoot{0%{transform:translate(8px,-8px);opacity:0}18%{transform:translate(0,0);opacity:1}78%{transform:translate(0,0);opacity:1}100%{transform:translate(0,0);opacity:0}}
@media(prefers-reduced-motion:reduce){.ico .ar{animation:none}}
.bk{transform-box:fill-box;animation:drop 2.6s ease-out infinite}
@keyframes drop{0%{transform:translateY(-9px);opacity:0}18%{transform:translateY(0);opacity:1}25%{transform:translateY(-2px)}32%{transform:translateY(0)}78%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
@media(prefers-reduced-motion:reduce){.bk{animation:none}}
.dd{position:absolute;left:14px;top:calc(100% + 6px);z-index:20;min-width:230px;display:none;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 24px #0002}
.dd.on{display:flex}
.dd button{border:none;background:none;width:100%;justify-content:flex-start;padding:10px 12px;border-radius:8px;font-size:.92rem}
.dd button:hover{background:var(--soft)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:10px;font-size:.9rem;z-index:50;max-width:90%;text-align:center}
.dd button.busy{opacity:.4;pointer-events:none}
.bar .chip.on{border-color:var(--line);background:var(--soft);box-shadow:none}
.tb{position:absolute;right:14px;top:50%;transform:translateY(-50%);flex-direction:row;gap:6px;padding:4px;border:none;background:none;font-size:.85rem;color:var(--ink)}
.lw{position:relative;width:50px;height:54px}
.fab{padding:0;border:none;background:none;border-radius:0;width:100%;height:100%}
.fab img{width:100%;height:100%;display:block}
#dim{position:fixed;inset:0;z-index:12;display:none}
.fo #dim{display:block}
.mn{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,6px);display:flex;gap:6px;opacity:0;pointer-events:none;transition:.18s}
.fo .mn{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pl{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.88rem;font-weight:500;white-space:nowrap}
.pl:hover{border-color:var(--mut)}

.chips,.tabs{scrollbar-width:none}.chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.ph{background:var(--soft);color:#d3ccbe}
.blur{width:100%;height:100%;padding:12px 14px;overflow:hidden;font-size:.78rem;line-height:1.45;color:var(--ink);opacity:.6;text-align:left;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.blur.empty{display:flex;align-items:center;justify-content:center;text-align:center;opacity:.35;font-style:italic}

/* ====== all white, no black fills: three white "materials" ====== */
:root{
  --hi:#fff;--lo:#d9d9d9;--ring:#2b2b2b1f;
  --fx-top:0 4px 18px -8px #0000002e;
  --fx-bar:0 -6px 20px -10px #0000002e;
  --press:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);
  --raise:0 6px 14px -6px #00000059,0 0 0 1px var(--line);
  --fx-project:0 6px 14px -8px #00000059;
  --fx-idea:0 14px 40px -10px #00000033,0 0 26px #fff;
  --fx-dream:8px 8px 18px var(--lo),-8px -8px 18px var(--hi);
}
.ph{color:var(--line)}
.top{box-shadow:var(--fx-top)}
.bar{box-shadow:var(--fx-bar)}
.dd{box-shadow:var(--fx-idea)}
.modal{background:#ffffffc7;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.box{box-shadow:var(--raise)}
.toast{background:#fff;color:var(--ink);box-shadow:var(--raise)}
[data-t=project]{--fx:var(--fx-project)}
[data-t=idea]{--fx:var(--fx-project)}
[data-t=dream]{--fx:var(--fx-project)}
.card[data-t],.card[data-t]:hover{box-shadow:var(--fx)}
.card[data-t] .ph{background:transparent}
.card[data-t] .blur{color:var(--ink);opacity:.72}
/* all categories: solid white, hairline, tight shadow */
.card[data-t] .im{border-bottom:1px solid var(--line)}
.card.empty[data-t],.card.empty[data-t]:hover{box-shadow:none;background:transparent}
#detail .dh{box-shadow:var(--fx)}
#detail .lg{background:var(--bg);border:none;box-shadow:var(--press);color:var(--ink)}
input:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px var(--ring);border-color:var(--mut)}
.bar .chip.on,.row .chip.on{background:var(--bg);color:var(--ink);border-color:transparent;box-shadow:var(--press)}
.bd[data-s]{font-weight:600}
.bd[data-s="In progress"]{background:var(--bg);color:var(--ink);box-shadow:var(--press)}
.bd[data-s="On hold"]{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--mut)}
.bd[data-s="Done"]{background:#fff;color:var(--ink);box-shadow:0 1px 5px #0000003d}
#msave{background:#fff;color:var(--ink);border-color:transparent;font-weight:600;box-shadow:var(--raise)}
.dd button:hover{background:var(--bg);box-shadow:var(--press)}
button.d:hover{box-shadow:var(--press)}
</style>
</head>
<body>
<div class="top"><div class="in"><img class="hl" id="hlogo" data-p="l" alt="Brainmate"><div class="brand" id="brand"><b>Brainmate</b></div><button id="sign" class="tb"></button><div class="dd" id="dd"><button id="ex"></button><button id="bk"></button><button id="inst" class="hide">Install app</button></div></div></div>

<div class="in">
  <div id="home"><div id="secs"></div></div>
  <div id="detail" class="hide"></div>
</div>

<nav class="bar"><div class="chips"><button class="chip on" data-k="all">All</button><button class="chip" data-k="project">Creations</button><button class="chip" data-k="idea">Imagination</button><button class="chip" data-k="dream">Aspiration</button></div></nav>
<div class="modal" id="modal"><div class="box">
  <h3 id="mt">Add new</h3>
      <input id="mn" placeholder="Name">
  <textarea id="ms" placeholder="Description" style="min-height:90px"></textarea>
  <div class="row"><button class="p" id="msave" style="flex:1;justify-content:center">Save</button><button id="mcancel">Cancel</button></div>
</div></div>

<script type="module">
const PI={l:'icons/logo.png'};document.querySelectorAll('[data-p]').forEach(i=>i.src=PI[i.dataset.p]);document.documentElement.style.setProperty('--logo-img','url('+PI.l+')');
/* ====== PWA: service worker + install prompt ====== */
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e));
let installEv=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;document.getElementById('inst').classList.remove('hide')});
addEventListener('appinstalled',()=>{installEv=null;document.getElementById('inst').classList.add('hide')});
document.getElementById('inst').onclick=async()=>{document.getElementById('dd').classList.remove('on');if(!installEv)return;installEv.prompt();await installEv.userChoice;installEv=null;document.getElementById('inst').classList.add('hide')};
/* ====== Put your Firebase config here ====== */
const firebaseConfig={
  apiKey:"AIzaSyAllHM5Uvul8TZWv-LMZ5EAHPiTQRJSI9A",
  authDomain:"brainmate-99345.firebaseapp.com",
  projectId:"brainmate-99345",
  storageBucket:"brainmate-99345.firebasestorage.app",
  messagingSenderId:"539305446691",
  appId:"1:539305446691:web:bdd20f560eba00e3be9096",
  measurementId:"G-SRMRKNE426"
};
/* =============================================== */

let db=null,auth=null,F={},A={};
if(!firebaseConfig.apiKey.startsWith("YOUR")){
  try{
    const u="https://www.gstatic.com/firebasejs/10.12.2/";
    const [a,f,t]=await Promise.all([import(u+"firebase-app.js"),import(u+"firebase-firestore.js"),import(u+"firebase-auth.js")]);
    const app=a.initializeApp(firebaseConfig);
    try{db=f.initializeFirestore(app,{localCache:f.persistentLocalCache({tabManager:f.persistentMultipleTabManager()})})}catch(e){db=f.getFirestore(app)}
    auth=t.getAuth(app);F=f;A=t;
  }catch(e){console.warn(e)}
}

const TYPES={project:{l:'Creations',n:'Creations',i:'folder'},dream:{l:'Aspiration',n:'Aspiration',i:'moon'},idea:{l:'Imagination',n:'Imagination',i:'bulb'}};
const TABS=[['desc','Details'],['feat','Features'],['check','Checklist'],['notes','Notes'],['drive','Drive']];
const STAT=['In progress','On hold','Done'];
const P={
 home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
 brain:'<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M17.6 6.5a3 3 0 0 0 .4-1.375M6 5.125A3 3 0 0 0 6.4 6.5M3.477 10.896a4 4 0 0 1 .585-.396M19.938 10.5a4 4 0 0 1 .585.396M6 18a4 4 0 0 1-1.967-.516M19.967 17.484A4 4 0 0 1 18 18"/>',
 target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
 blocks:'<rect width="7" height="7" x="14" y="3" rx="1"/><path d="M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"/>',
 download:'<path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>',
 cloud:'<path d="M12 13v8"/><path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/><path d="m8 17 4-4 4 4"/>',
 login:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 moon:'<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>',
 bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 0 0-4-10z"/>'
};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const DF=()=>({checklist:[],features:[],notes:[],desc:'',driveId:'',status:'In progress'});
const D={};let cur=null,tab='desc',filter='all',mode=null,user=null,unsub=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deb=(f,ms=600)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const bn=n=>String(n);
const LK='bm_local_v1',cloud=()=>!!(db&&user);
const saveLocal=()=>{try{localStorage.setItem(LK,JSON.stringify(D))}catch(e){toast('Device storage is full')}};
const save=(id,p)=>{Object.assign(D[id],p);if(cloud())F.updateDoc(F.doc(db,'items',id),p);else saveLocal()};
const blurText=v=>v.desc?esc(v.desc):'Add description';
const cnt=v=>{const L=v.checklist,d=L.filter(x=>x.d).length;return{d,n:L.length,p:L.length?Math.round(d/L.length*100):0}};

function nav(){
  const b=$('#sign');
  $('#bk').innerHTML=ic('cloud',18)+'<span>Backup to Google Drive</span>';$('#ex').innerHTML=ic('download',18)+'<span>Export data</span>';
    b.innerHTML=user?(user.photoURL?`<img src="${esc(user.photoURL)}" style="width:22px;height:22px;border-radius:50%" alt="">`:ic('user')):ic('user');
  b.title=b.ariaLabel=user?'Log out':'Log in';
}
const SCOPE='https://www.googleapis.com/auth/drive.file';
let gtoken=null;
const mkProv=()=>{const p=new A.GoogleAuthProvider();p.addScope(SCOPE);return p};
const tokOf=r=>A.GoogleAuthProvider.credentialFromResult(r)?.accessToken||null;
const login=()=>A.signInWithPopup(auth,mkProv()).then(r=>{gtoken=tokOf(r)}).catch(e=>alert('Login failed: '+e.code));
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)};
async function gfetch(url,o={}){
  for(let i=0;i<2;i++){
    if(!gtoken)gtoken=tokOf(await A.reauthenticateWithPopup(user,mkProv()));
    const r=await fetch(url,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+gtoken}});
    if(r.status===401){gtoken=null;continue}
    if(!r.ok)throw new Error('Drive '+r.status);
    return r;
  }
  throw new Error('Drive auth failed');
}
async function backup(){
  if(!auth)return toast('Backup needs Firebase');
  if(!user){toast('Log in with Google to use Drive backup');return login()}
  const b=$('#bk');b.classList.add('busy');
  try{
    const name='brainmate-backup.json';
    const body=JSON.stringify({app:'Brainmate',savedAt:new Date().toISOString(),items:D},null,1);
    const q=encodeURIComponent(`name='${name}' and trashed=false`);
    const f=(await(await gfetch('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+q)).json()).files||[];
    if(f.length)await gfetch('https://www.googleapis.com/upload/drive/v3/files/'+f[0].id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});
    else{
      const bd='bm'+Date.now();
      const mp=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name,mimeType:'application/json'})}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
      await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp});
    }
    toast('Backup saved to Google Drive');
  }catch(e){console.warn(e);toast('Backup failed')}
  b.classList.remove('busy');
}
$('#bk').onclick=backup;
$('#ex').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'Brainmate',exportedAt:new Date().toISOString(),items:D},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='brainmate-export-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Data exported');
};
$('#sign').onclick=()=>{if(!auth)return;user?confirm('Log out?')&&A.signOut(auth):login()};
function goHome(){cur=null;$('#detail').classList.add('hide');$('#home').classList.remove('hide');closeModal();home();scrollTo(0,0)}
$('#brand').onclick=goHome;$('#hlogo').onclick=e=>{e.stopPropagation();$('#dd').classList.toggle('on')};
document.addEventListener('click',e=>{if(!e.target.closest('#dd'))$('#dd').classList.remove('on')});
addEventListener('keydown',e=>e.key==='Escape'&&$('#dd').classList.remove('on'));

const DEMO={
project:[

['Write a Book','First book manuscript','In progress','Create outline|First 5 chapters|Edit draft|Find a publisher',1,'Chapter list|Cover ideas','Plan to write a little every day.'],
['Fitness Routine','Healthy habits','On hold','Set a routine|Start morning walks|Meal plan',1,'Weekly chart|Water intake log','Exercise at least 4 days a week.'],
['Online Course','Learn a new skill','Done','Modules 1–5|Modules 6–10|Final exam',3,'Save notes|Certificate','A course to build skills from home.']],
dream:[
['Own Home','Dream address','In progress','Set budget|Find land|Get design drawn|Start construction',1,'Budget list|Design ideas','A home of our own for the family.'],
['World Travel','See the world','In progress','Country list|Start saving|Renew passport',1,'Destinations|Travel budget','Visit at least 10 countries in life.'],
['Own Company','My own venture','On hold','Business idea|Market research|Initial capital|License',0,'Business plan|Potential partners','Build a company of my own.'],
['Start a Library','A book house for the village','In progress','Find a location|Collect books|Shelves & furniture|Opening',1,'Book list|Volunteers','A small library open to everyone.']],
idea:[
['Mobile App Idea','Daily task helper','In progress','Identify the problem|Design draft|Prototype',1,'User list|Core features','An app with simple solutions to everyday problems.'],
['YouTube Channel','Learn & teach','On hold','Choose a topic|First video script|Make the video',0,'Video list|Thumbnail ideas','Explain what I know in simple language.'],
['Community Library','Book exchange','In progress','Write a proposal|Find members|Collect books',1,'Member list|Book register','Sharing books among neighbors.'],
['Kids Learning Game','Learn while playing','In progress','Story draft|Draw characters|First level',1,'Level list|Reward system','A game to learn math and language through play.']]

const demoItems=()=>{let n=Date.now();return Object.entries(DEMO).flatMap(([type,l])=>l.map(([name,title,status,ck,dn,ft,desc])=>({...DF(),type,name,title,status,desc,image:'',checklist:ck.split('|').map((t,i)=>({t,d:i<dn})),features:ft.split('|'),ts:n++})))};
let seeded=false;try{seeded=!!localStorage.getItem('mw_seeded')}catch(e){}

function home(){
  document.querySelectorAll('.bar .chip').forEach(c=>c.classList.toggle('on',c.dataset.k===filter));
  let h='';
  h+=Object.entries(TYPES).filter(([k])=>filter==='all'||filter===k).map(([k,t])=>{
    const items=Object.entries(D).filter(([,v])=>v.type===k).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));
    let c=items.map(([id,v])=>{const s=cnt(v);return `<div class="card" data-id="${id}" data-t="${k}"><div class="im${v.image?'':' ph'}">${v.image?`<img src="${v.image}" alt="">`:`<div class="blur${v.desc?'':' empty'}">${blurText(v)}</div>`}</div><div class="tx"><div class="nm">${esc(v.name)}</div></div></div>`}).join('');
    if(!items.length)c=`<div class="card empty" data-new="${k}" data-t="${k}"><div class="im">${ic('plus',34)}</div><div class="tx"><div class="nm">Empty — click to add</div></div></div>`;
    return `<div class="sh" data-t="${k}"><h2>${t.l}</h2><button class="p plus" data-new="${k}" aria-label="Add new" title="Add new">${ic('plus',18)}</button></div><div class="grid">${c}</div>`;
  }).join('');
  $('#secs').innerHTML=h;
}
$('#secs').addEventListener('click',e=>{
  if(e.target.closest('[data-login]'))return login();
  const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;return home()}
  const x=e.target.closest('[data-del]');if(x){e.stopPropagation();return delItem(x.dataset.del)}
  const n=e.target.closest('[data-new]');if(n)return openModal({type:n.dataset.new});
  const c=e.target.closest('[data-id]');if(c)openDetail(c.dataset.id);
});
function delItem(id){
  if(!confirm('Delete this permanently?'))return;
  if(cloud())F.deleteDoc(F.doc(db,'items',id));
  delete D[id];if(!cloud())saveLocal();goHome();
}

function openModal(m){
  mode=m;const v=m.id?D[m.id]:{};
  $('#mn').value=v.name||'';$('#ms').value=v.desc||'';
  $('#mt').textContent=m.id?'Edit':'New — '+TYPES[m.type].l;$('#modal').classList.add('on');
}
function closeModal(){$('#modal').classList.remove('on')}
$('#mcancel').onclick=closeModal;
$('#msave').onclick=async()=>{
  const name=$('#mn').value.trim(),desc=$('#ms').value.trim();
  if(!name)return $('#mn').focus();
  if(mode.id){save(mode.id,{name,desc});closeModal();openDetail(mode.id)}
  else{
    const data={...DF(),type:mode.type,name,desc,ts:Date.now()};
    if(cloud()){const r=await F.addDoc(F.collection(db,'items'),{...data,created:F.serverTimestamp()});D[r.id]=data}
    else{D['l'+Date.now()]=data;saveLocal()}
    closeModal();home();
  }
};

function openDetail(id){
  cur=id;tab='desc';const v=D[id],t=TYPES[v.type];
  $('#home').classList.add('hide');const el=$('#detail');el.classList.remove('hide');el.dataset.t=v.type;
  el.innerHTML=`
  <div class="row" style="margin-top:14px;justify-content:space-between"><button id="back">${ic('back',18)} Back</button><div class="row"><button id="edit">${ic('edit',16)} Edit</button><button class="d" id="del">${ic('trash',16)} Delete</button></div></div>
  <div class="dh"><div class="lg">${v.image?`<img src="${v.image}" alt="">`:ic(t.i,32)}</div><div style="min-width:0"><h2>${esc(v.name)}</h2><div class="st">${esc(v.title)}</div><div class="meta"><span class="bd" id="hs"></span><span id="hn"></span></div></div></div>
  <div class="tabs">${TABS.map(([k,l])=>`<button class="tab ${k===tab?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>
  <div id="tc"></div>`;
  scrollTo(0,0);
  $('#back').onclick=goHome;
  $('#edit').onclick=()=>openModal({id});
  $('#del').onclick=()=>delItem(id);
  el.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;el.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));renderTab()};
  bindTc();hero();renderTab();
}
function hero(){
  const v=D[cur],s=cnt(v);
  $('#hn').textContent=`${bn(s.d)}/${bn(s.n)} tasks done`;$('#hs').textContent=v.status;$('#hs').dataset.s=v.status;
}
function renderTab(){
  const v=D[cur],tc=$('#tc');let h='';
  if(tab==='desc')h=`<div class="panel"><h3>Status</h3><div class="row" style="flex-wrap:wrap">${STAT.map(s=>`<button class="chip ${v.status===s?'on':''}" data-a="st" data-v="${s}">${s}</button>`).join('')}</div></div><div class="panel"><h3>Description & plan</h3><textarea id="desc" placeholder="Write the description and plan here…">${esc(v.desc)}</textarea></div>`;
  if(tab==='feat')h=`<div class="panel"><h3>Features list</h3>${v.features.map((x,i)=>`<div class="ck"><span>${esc(x)}</span><button class="d" data-a="fdel" data-i="${i}">${ic('x',16)}</button></div>`).join('')||'<div class="mut">No features yet</div>'}<div class="row" style="margin-top:10px"><input id="fin" data-enter="fadd" placeholder="New feature…"><button class="p" data-a="fadd">Add</button></div></div>`;
  if(tab==='check')h=`<div class="panel"><h3>Checklist</h3>${v.checklist.map((x,i)=>`<div class="ck ${x.d?'done':''}"><input type="checkbox" data-a="ctog" data-i="${i}" ${x.d?'checked':''}><span>${esc(x.t)}</span><button class="d" data-a="cdel" data-i="${i}">${ic('x',16)}</button></div>`).join('')||'<div class="mut">No tasks yet</div>'}<div class="row" style="margin-top:10px"><input id="cin" data-enter="cadd" placeholder="New task…"><button class="p" data-a="cadd">Add</button></div></div>`;
  if(tab==='notes')h=`<div class="panel"><h3>Development notes</h3>${v.notes.map((n,i)=>`<div class="note"><small><span>${new Date(n.at).toLocaleString('en-US')}</span><a href="#" data-a="ndel" data-i="${i}" style="color:var(--red)">Delete</a></small><textarea data-n="${i}" placeholder="Write a note…">${esc(n.x)}</textarea></div>`).join('')}<button class="p" data-a="nadd" style="margin-top:10px">${ic('plus',16)} New note</button></div>`;
  if(tab==='drive')h=`<div class="panel"><h3>Drive folder</h3><div class="row"><input id="din" data-enter="dset" placeholder="Google Drive folder link or ID" value="${esc(v.driveId?'https://drive.google.com/drive/folders/'+v.driveId:'')}"><button class="p" data-a="dset">Show</button></div><div class="mut" style="margin-top:6px">The folder must be shared as “Anyone with the link — Viewer”.</div>${v.driveId?`<iframe src="https://drive.google.com/embeddedfolderview?id=${v.driveId}#grid" loading="lazy"></iframe>`:''}</div>`;
  tc.innerHTML=h;
}
const sd1=deb((id,p)=>save(id,p)),sd2=deb((id,p)=>save(id,p));
function bindTc(){
  const tc=$('#tc');
  tc.onclick=e=>{
    const b=e.target.closest('[data-a]');if(!b)return;
    const v=D[cur],a=b.dataset.a,i=+b.dataset.i,inp=id=>$(id).value.trim();
    if(a==='st'){save(cur,{status:b.dataset.v});hero();renderTab()}
    else if(a==='fadd'){const t=inp('#fin');if(!t)return;save(cur,{features:[...v.features,t]});renderTab()}
    else if(a==='fdel'){const f=[...v.features];f.splice(i,1);save(cur,{features:f});renderTab()}
    else if(a==='cadd'){const t=inp('#cin');if(!t)return;save(cur,{checklist:[...v.checklist,{t,d:false}]});hero();renderTab()}
    else if(a==='ctog'){const L=v.checklist.map(x=>({...x}));L[i].d=b.checked;save(cur,{checklist:L});hero();renderTab()}
    else if(a==='cdel'){const L=[...v.checklist];L.splice(i,1);save(cur,{checklist:L});hero();renderTab()}
    else if(a==='nadd'){save(cur,{notes:[...v.notes,{x:'',at:Date.now()}]});renderTab();const t=tc.querySelectorAll('textarea');t[t.length-1]?.focus()}
    else if(a==='ndel'){e.preventDefault();const N=[...v.notes];N.splice(i,1);save(cur,{notes:N});renderTab()}
    else if(a==='dset'){const s=inp('#din'),m=s.match(/folders\/([\w-]+)/)||s.match(/[?&]id=([\w-]+)/)||s.match(/^([\w-]{15,})$/);save(cur,{driveId:m?m[1]:''});renderTab()}
  };
  tc.onkeydown=e=>{const k=e.target.dataset.enter;if(e.key==='Enter'&&k)tc.querySelector(`[data-a="${k}"]`).click()};
  tc.oninput=e=>{
    const t=e.target;
    if(t.id==='desc'){D[cur].desc=t.value;sd1(cur,{desc:t.value})}
    else if(t.dataset.n!==undefined){D[cur].notes[+t.dataset.n].x=t.value;sd2(cur,{notes:D[cur].notes})}
  };
}

function loadGuest(){
  let o=null;try{o=JSON.parse(localStorage.getItem(LK)||'null')}catch(e){}
  if(o&&Object.keys(o).length)Object.entries(o).forEach(([k,v])=>D[k]={...DF(),...v});
  else{demoItems().forEach((x,i)=>D['d'+i]=x);saveLocal()}
}
function listen(){
  unsub=F.onSnapshot(F.collection(db,'items'),s=>{
    if(s.empty&&!seeded&&!s.metadata.fromCache){seeded=true;try{localStorage.setItem('mw_seeded','1')}catch(e){}demoItems().forEach(x=>F.addDoc(F.collection(db,'items'),{...x,created:F.serverTimestamp()}));return}
    s.docChanges().forEach(c=>{
      if(c.type==='removed')delete D[c.doc.id];
      else if(c.doc.id!==cur)D[c.doc.id]={...DF(),...c.doc.data()};
    });
    if(!cur)home();
  });
}
{const I={all:'home',project:'blocks',idea:'brain',dream:'target'};document.querySelectorAll('.bar .chip').forEach(c=>c.insertAdjacentHTML('afterbegin',c.dataset.k==='idea'?'<span class="ico">'+ic(I.idea,20)+'<i></i><i></i><i></i></span>':c.dataset.k==='dream'?'<span class="ico">'+ic(I.dream,20)+'<svg class="ar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L12 12M12 12h5M12 12V7"/></svg></span>':c.dataset.k==='project'?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"/><rect class="bk" width="7" height="7" x="14" y="3" rx="1"/></svg>':ic(I[c.dataset.k],20)))}
document.querySelectorAll('.bar .chip').forEach(c=>c.onclick=()=>{filter=c.dataset.k;goHome()});
nav();
if(auth)A.onAuthStateChanged(auth,u=>{
  user=u;nav();
  if(unsub){unsub();unsub=null}
  Object.keys(D).forEach(k=>delete D[k]);
  if(u)listen();else loadGuest();
  goHome();
});
else{loadGuest();home()}
</script>
